name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - run: make test

  integration:
    name: Integration Tests (PostgreSQL and YugabyteDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FABRIC_X_MIGRATION_TEST_DATABASE_URL: postgres://postgres@localhost:25432/postgres?sslmode=disable
      FABRIC_X_MIGRATION_TEST_YUGABYTE_DATABASE_URL: postgres://yugabyte@localhost:25433/yugabyte?sslmode=disable
      FABRIC_X_MIGRATION_TEST_FABRIC: '1'
      FABRIC_X_MIGRATION_TEST_DEPLOYMENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - run: make acceptance-binaries
      - name: Start disposable databases
        run: |
          docker compose -f docker/compose.test.yaml up -d --wait --wait-timeout 180
          postgres=$(docker compose -f docker/compose.test.yaml ps -q postgres)
          yugabyte=$(docker compose -f docker/compose.test.yaml ps -q yugabyte)
          echo "FABRIC_X_MIGRATION_TEST_POSTGRES_CONTAINER=$postgres" >> "$GITHUB_ENV"
          echo "FABRIC_X_MIGRATION_TEST_YUGABYTE_CONTAINER=$yugabyte" >> "$GITHUB_ENV"
      - name: Test imports, snapshots, deployment, and recovery
        run: make test-integration
      - name: Database logs
        if: failure()
        run: docker compose -f docker/compose.test.yaml logs
      - name: Remove disposable databases
        if: always()
        run: docker compose -f docker/compose.test.yaml down --volumes --remove-orphans
